<div class="field{% if field.errors %} has-error{% endif %}{% if wide %} wide{% endif %}">
  {% if field.field.widget.input_type == "checkbox" and not field.field.widget.allow_multiple_selected %}
    <label class="check">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="field-error">{{ e }}</p>{% endfor %}
</div>
