apiVersion: v1
kind: Service
metadata:
  name: {{ include "pubtracker.fullname" . }}
  labels:
    {{- include "pubtracker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pubtracker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
