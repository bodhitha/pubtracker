{{- if not .Values.global.pubtracker.existingSecret }}
{{- $name := include "pubtracker.fullname" . }}
{{- /* keep the values across upgrades: a new proxy-password would lock everyone out until pods restart */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pubtracker.labels" . | nindent 4 }}
type: Opaque
data:
  django-secret-key: {{ get $existing "django-secret-key" | default (randAlphaNum 50 | b64enc) }}
  proxy-password: {{ get $existing "proxy-password" | default (randAlphaNum 40 | b64enc) }}
{{- end }}
