{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pubtracker.fullname" . }}
  labels:
    {{- include "pubtracker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pubtracker.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "pubtracker.proxyName" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
