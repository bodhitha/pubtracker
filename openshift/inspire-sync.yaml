# Nightly INSPIRE sync. Apply only once `check_inspire` succeeds from the app pod (see README):
#   oc apply -f openshift/inspire-sync.yaml
# Runs after the 02:30 database dump in postgres.yaml, so the night's dump predates any changes.
# `pubtracker:latest` resolves to the ImageStream because of `oc set image-lookup pubtracker`
# (README step 3), so each run uses the newest build.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pubtracker-inspire-sync
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0          # a failed run is retried by the next night's run, not immediately
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: pubtracker:latest
              command: ["python", "manage.py", "sync_inspire"]
              envFrom:
                - configMapRef: {name: pubtracker-config}
                - secretRef: {name: pubtracker-app}      # DATABASE_URL
              resources:
                requests: {cpu: 20m, memory: 128Mi}
                limits: {memory: 256Mi}
