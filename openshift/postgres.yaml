# Only needed if your institution does not offer a managed PostgreSQL database.
# Create the secret first:
#   oc create secret generic pubtracker-db --from-literal=POSTGRESQL_USER=pubtracker \
#     --from-literal=POSTGRESQL_PASSWORD="$(openssl rand -hex 24)" --from-literal=POSTGRESQL_DATABASE=pubtracker
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pubtracker-db
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pubtracker-db
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: pubtracker-db}
  template:
    metadata:
      labels: {app: pubtracker-db}
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-16-c9s:latest   # runs under OKD's random UID
          envFrom:
            - secretRef: {name: pubtracker-db}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: ["/usr/libexec/check-container"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: pubtracker-db}
---
apiVersion: v1
kind: Service
metadata:
  name: pubtracker-db
spec:
  selector: {app: pubtracker-db}
  ports:
    - {port: 5432, targetPort: 5432}
---
# Nightly dump, keeping the last 14 days. Copy these off the cluster too, or ask your admins
# whether volume snapshots/backups already cover this PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pubtracker-backups
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pubtracker-db-backup
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dump
              image: quay.io/sclorg/postgresql-16-c9s:latest
              envFrom:
                - secretRef: {name: pubtracker-db}
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  PGPASSWORD="$POSTGRESQL_PASSWORD" pg_dump -h pubtracker-db -U "$POSTGRESQL_USER" "$POSTGRESQL_DATABASE"
                  | gzip > /backups/pubtracker-$(date +%F).sql.gz
                  && find /backups -name '*.sql.gz' -mtime +14 -delete
              volumeMounts:
                - {name: backups, mountPath: /backups}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: pubtracker-backups}
